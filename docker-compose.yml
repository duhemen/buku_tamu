version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buku_tamu
      POSTGRES_PASSWORD: buku_tamu_pass
      POSTGRES_DB: buku_tamu
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buku_tamu"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: bt-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data: